async function run(pw,rem){const m=document.getElementById('m');m.textContent='확인 중...';
 try{const h=await open_(pw);if(rem){try{localStorage.setItem('nh_pw',pw)}catch(e){}}document.open();document.write(h);document.close()}
 catch(e){m.textContent='비밀번호가 맞지 않습니다.';try{localStorage.removeItem('nh_pw')}catch(e2){}}}
document.getElementById('go').onclick=()=>run(document.getElementById('pw').value,document.getElementById('rm').checked);
document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')document.getElementById('go').click()};
try{const s=localStorage.getItem('nh_pw');if(s)run(s,true)}catch(e){}
</script></body></html>
