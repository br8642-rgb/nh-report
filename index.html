const u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function open_(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));return new TextDecoder().decode(p)}
async function run(pw,rem){const m=document.getElementById('m');m.textContent='확인 중...';
 try{const h=await open_(pw);try{sessionStorage.setItem('nh_pw',pw)}catch(e){}if(rem){try{localStorage.setItem('nh_pw',pw)}catch(e){}}document.open();document.write(h);document.close()}
 catch(e){document.documentElement.className='';m.textContent='비밀번호가 맞지 않습니다.';try{localStorage.removeItem('nh_pw');sessionStorage.removeItem('nh_pw')}catch(e2){}}}
document.getElementById('go').onclick=()=>run(document.getElementById('pw').value,document.getElementById('rm').checked);
document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')document.getElementById('go').click()};
try{const s=sessionStorage.getItem('nh_pw')||localStorage.getItem('nh_pw');if(s)run(s,!!localStorage.getItem('nh_pw'))}catch(e){}
